services:
  postgres:
    image: postgres:16
    container_name: meeting-inspection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting_inspection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_inspection"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./meeting-room-inspection-backend
      dockerfile: Dockerfile
    container_name: meeting-inspection-backend
    restart: unless-stopped
    env_file:
      - ./meeting-room-inspection-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/meeting_inspection
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./meeting-room-inspection-backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./meeting-room-inspection-frontend
      dockerfile: Dockerfile
    container_name: meeting-inspection-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: meeting-room-inspection-backend_postgres_data
    external: true
